# Hooks are intentionally staged-file scoped so they stay fast enough to run on
# every commit. The full sweep lives in CI (`bun run check`).
pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,md,yaml,yml}'
      # ignorePatterns で全部除外された場合に「対象なし」で落ちないようにする
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: oxlint
      glob: '*.{js,ts,mjs,cjs}'
      # tools/lint/test/fixtures/** は意図的に規約を破る検体なので除外する
      # （package.json の `lint` script と同じ扱い）。
      run: bunx oxlint --type-aware --deny-warnings --ignore-pattern 'tools/lint/test/fixtures/**' {staged_files}

    - name: stylelint
      glob: '{system/css/**/*.css,library/elements/**/*.styles.ts,apps/storybook/**/*.css}'
      run: bunx stylelint --config tools/lint/stylelint.config.js {staged_files}

    - name: secrets
      run: |
        # *.example は値が空なので対象外。
        if git diff --cached -U0 -- ':!*.example' | grep -nE '^\+.*(BEGIN [A-Z ]*PRIVATE KEY|npm_[A-Za-z0-9]{36}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})'; then
          echo "Refusing to commit what looks like a secret." >&2
          exit 1
        fi

pre-push:
  parallel: false
  jobs:
    - name: typecheck
      run: bun run typecheck

    - name: test
      run: bun run test

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        head -1 "{1}" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .{1,}' || {
          echo "Commit message must be Conventional Commits, e.g. 'feat(elements): add rd-button'" >&2
          exit 1
        }
