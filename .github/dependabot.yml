# 依存の更新（plan 010）。週 1 でまとめて上げ、CI（ci.yml）が緑ならマージする
# （docs/governance.md §定期作業）。
#
# **エコシステムは `github-actions` だけ。`bun` は外した。** Dependabot に同梱された bun が
# このリポジトリの lockfile を読めず、
# `Unsupported bun.lock 'lockfileVersion' 2 in /bun.lock. The bun version Dependabot runs supports up to 1.`
# で必ず落ちるため。
# `npm` に替える手も無い。package-lock.json を置いていないので読むものが無い。
# そのためライブラリの依存は当面手で上げる（`bun outdated` で見て `bun update`。
# 上げた結果は ci.yml が検査する）。
# Dependabot が lockfileVersion 2 を読めるようになったら `bun` の block を戻す。
version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
